[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanta"
version = "0.2.0"
description = "Quantization primitives for PyTorch — int8 / int4 / NF4 / FP4 / NF8 / FP8"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Quanta Contributors"},
]
keywords = ["pytorch", "quantization", "nf4", "fp4", "int8", "llm", "qlora"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2.0",
]

[project.optional-dependencies]
triton = ["triton>=2.2.0"]
benchmark = ["matplotlib>=3.5", "bitsandbytes>=0.43"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/ved1beta/Quanta"
Issues = "https://github.com/ved1beta/Quanta/issues"

[tool.setuptools.packages.find]
include = ["Quanta*"]

[tool.pytest.ini_options]
testpaths = ["Quanta/tests"]
python_files = "test_*.py"
