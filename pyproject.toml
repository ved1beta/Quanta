[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanta"
version = "0.1.0"
description = "Efficient quantization and memory optimization primitives for PyTorch"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Quanta Contributors" }]
keywords = ["pytorch", "quantization", "nf4", "int8", "llm", "qlora"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
triton = ["triton>=2.2.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black",
    "isort",
    "ruff",
]
bench = [
    "bitsandbytes",
    "matplotlib",
    "seaborn",
    "pandas",
]

[tool.setuptools.packages.find]
include = ["Quanta*"]
exclude = ["example*", "tests*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["Quanta/tests"]
python_files = "test_*.py"
